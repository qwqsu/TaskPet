<!doctype html>
<!-- 任务面板 Renderer：今日任务、历史记录和任务编辑对话框。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPet 任务</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- 页面标题、完成摘要和添加任务入口。 -->
      <header class="app-header">
        <div>
          <p class="eyebrow">TASKPET</p>
          <h1 id="pageTitle">今日任务</h1>
          <p id="todaySummary" class="summary">正在读取本地任务…</p>
        </div>
        <button id="addTaskButton" class="primary-button" type="button">＋ 添加</button>
      </header>

      <!-- 任务、历史和实际运行总计时。设置已拆分为独立窗口。 -->
      <nav class="tabs" aria-label="任务页面">
        <button class="tab active" type="button" data-view="today" aria-selected="true">任务</button>
        <button class="tab" type="button" data-view="history" aria-selected="false">历史</button>
        <button class="tab" type="button" data-view="stats" aria-selected="false">总计时</button>
      </nav>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

      <!-- 列表卡片由 panel.ts 动态创建，HTML 只提供挂载点。 -->
      <section id="todayView" class="view" aria-labelledby="pageTitle">
        <div id="todayList" class="task-list"></div>
      </section>

      <section id="historyView" class="view hidden" aria-label="最近 30 天历史">
        <div id="historyList" class="history-list"></div>
      </section>

      <section id="statsView" class="view hidden" aria-label="任务总计时">
        <div class="stats-periods" role="group" aria-label="统计范围">
          <button class="stats-period active" type="button" data-stats-period="today" aria-pressed="true">今日计时</button>
          <button class="stats-period" type="button" data-stats-period="week" aria-pressed="false">周计时</button>
        </div>
        <div class="stats-total-card">
          <span>累计专注</span>
          <strong id="statsTotal">0 秒</strong>
          <small id="statsRange">按 TaskPet 已记录的实际运行时间统计</small>
        </div>
        <div id="statsList" class="stats-list"></div>
      </section>
    </main>

    <!-- 添加和编辑共用同一个 dialog；editingTaskId 是否为空用于区分模式。 -->
    <dialog id="taskDialog" class="task-dialog">
      <form id="taskForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">TASK</p>
            <h2 id="dialogTitle">添加任务</h2>
          </div>
          <button id="cancelTaskButton" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>

        <input id="editingTaskId" type="hidden" />

        <label class="field">
          <span>标题</span>
          <input id="taskTitle" name="title" type="text" maxlength="120" required autofocus />
        </label>

        <label class="field">
          <span>描述 <small>可选</small></span>
          <textarea id="taskDescription" name="description" maxlength="2000" rows="3"></textarea>
        </label>

        <div class="field-grid">
          <label class="field">
            <span>类型</span>
            <select id="taskType" class="modern-select" name="taskType">
              <option value="daily">每日</option>
              <option value="one_time">一次性</option>
            </select>
            <small id="taskTypeHint" class="field-hint hidden">创建后类型不可修改</small>
          </label>

          <label class="field">
            <span>完成方式</span>
            <select id="completionMode" class="modern-select" name="completionMode">
              <option value="duration">目标时长</option>
              <option value="manual">手动勾选</option>
              <option value="process_start">启动即完成</option>
            </select>
          </label>
        </div>

        <label id="durationField" class="field">
          <span>目标分钟数</span>
          <input id="targetMinutes" name="targetMinutes" type="number" min="1" max="100000" value="25" />
          <small>绑定程序运行期间累计；关闭后暂停，下次启动继续。</small>
        </label>

        <!-- 程序绑定可选择当前快照或由系统文件选择器选择 exe。 -->
        <section class="program-binding" aria-labelledby="programBindingTitle">
          <div class="binding-heading">
            <div>
              <span id="programBindingTitle">绑定程序 <small>可选</small></span>
              <p id="programSummary" class="program-summary">尚未绑定程序</p>
            </div>
            <button id="clearProgramButton" class="text-button hidden" type="button">清除</button>
          </div>

          <label id="matchModeField" class="field compact-field hidden">
            <span>匹配方式</span>
            <select id="processMatchMode" class="modern-select" name="processMatchMode">
              <option value="exact_path">精确 exe 路径（推荐）</option>
              <option value="process_name">仅按进程名</option>
            </select>
            <small id="matchModeHint">精确路径可避免同名程序误匹配。</small>
          </label>

          <div class="binding-actions">
            <button id="chooseRunningButton" class="secondary-button" type="button">选择正在运行</button>
            <button id="chooseExeButton" class="secondary-button" type="button">选择 exe 文件</button>
          </div>

          <div id="runningProgramPicker" class="running-program-picker hidden" aria-live="polite">
            <div class="picker-heading">
              <strong>当前程序</strong>
              <label class="program-search">
                <span class="sr-only">搜索当前程序</span>
                <input id="runningProgramSearch" type="search" placeholder="搜索 exe 或路径" autocomplete="off" />
              </label>
              <button id="closeRunningPickerButton" class="text-button" type="button">收起</button>
            </div>
            <div id="runningProgramList" class="running-program-list"></div>
          </div>
        </section>

        <div class="dialog-actions">
          <button id="archiveTaskButton" class="danger-button hidden" type="button">归档</button>
          <span class="action-spacer"></span>
          <button id="dismissTaskButton" class="secondary-button" type="button">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="../../../build/renderer/panel/panel.js"></script>
  </body>
</html>
