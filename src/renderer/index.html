<!doctype html>
<!-- 桌宠 Renderer：只包含 sprite 和状态文字，不直接访问 Node.js/SQLite。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPet</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <!-- 可拖拽宠物区域；sprite 加载失败时显示 fallback 机器人。 -->
      <section id="pet" class="pet" aria-label="TaskPet 桌宠">
        <div id="sprite" class="sprite"></div>
        <div id="fallback" class="fallback">
          <div class="bot-head">
            <span></span>
            <span></span>
          </div>
          <div class="bot-body"></div>
        </div>
      </section>
      <!-- message 是任务文字，detail 是独立计时，长标题不会挤掉计时。 -->
      <div id="petStatus" class="pet-status" role="status" aria-live="polite">
        <span id="petStatusMessage" class="pet-status-message"></span>
        <span id="petStatusDetail" class="pet-status-detail"></span>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
