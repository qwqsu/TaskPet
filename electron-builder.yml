appId: com.taskpet.shell
productName: TaskPet
copyright: Copyright © 2026 TaskPet contributors
icon: src/assets/logo.png
publish: null

directories:
  output: dist

files:
  - src/**
  - build/**
  - package.json
  - LICENSE
  - README.md
  - '!**/.DS_Store'
  - '!**/*.map'
  - '!**/test/**'
  - '!**/.github/**'
  - '!scripts/**'
  - '!src/**/*.ts'
  # 宠物目录需要接收用户导入，不能放进只读的 app.asar。
  - '!src/assets/pets/**'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/**/*.ts'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/koffi/doc/**'
  - '!node_modules/koffi/lib/native/**'
  - '!node_modules/koffi/src/koffi/src/**/*.cc'
  - '!node_modules/koffi/src/koffi/src/**/*.hh'
  - '!node_modules/koffi/src/koffi/src/**/*.inc'
  - '!node_modules/koffi/src/koffi/src/**/*.def'
  - '!node_modules/koffi/vendor/**'
  - '!node_modules/@koromix/**/*.lib'

asar: true
asarUnpack:
  - node_modules/better-sqlite3/build/Release/*.node
  - node_modules/@koromix/*/**/*.node

electronLanguages:
  - en-US
  - zh-CN

extraResources:
  - from: THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  - from: src/assets/pets
    to: src/assets/pets

win:
  executableName: TaskPet
  # v1.0 暂未配置代码签名；仍保留资源编辑，让 exe 和安装包写入
  # TaskPet 图标、产品名与版本信息。
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  differentialPackage: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TaskPet
  uninstallDisplayName: TaskPet
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true
  target:
    - dmg
    - zip
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

npmRebuild: true
