appId: com.taskpet.shell
productName: TaskPet
copyright: Copyright © 2026 TaskPet contributors
icon: src/assets/logo.png
publish: null

directories:
  output: dist

files:
  - src/**
  - build/**
  - package.json
  - LICENSE
  - README.md
  - README.zh-CN.md
  - '!**/.DS_Store'
  - '!**/*.map'
  - '!**/test/**'
  - '!**/.github/**'
  - '!scripts/**'

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/koffi/**
  - node_modules/@koromix/**

extraResources:
  - from: THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt

win:
  executableName: TaskPet
  # P4 remains unsigned, but resource editing stays enabled so the TaskPet icon
  # and executable metadata are applied to Windows artifacts.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  differentialPackage: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TaskPet
  uninstallDisplayName: TaskPet
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true
  target:
    - dmg
    - zip
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

npmRebuild: true
